<style>
/* Layout: one verse per screen, study-card reader; header + reader + bottom nav. 藍 ink accent, 朱 verse marks. */
:root {
  --bg: #f3f5f8; --card: #ffffff; --fg: #1d2430; --muted: #66707f; --line: #d9dee6;
  --ai: #2a4f7a; --ai-soft: #e7eef7; --shu: #b8372d; --chunk: #fbf3f2; --chunk-line: #e3b9b4;
  --mod-bg: #e9f2f8; --mod-fg: #1c4a6b;
  --jp: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  --zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
  --fs: 17px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --card: #1a2029; --fg: #e4e8ee; --muted: #9aa4b2; --line: #2e3744;
  --ai: #8fb4e0; --ai-soft: #22324a; --shu: #e8786d; --chunk: #2a1f20; --chunk-line: #6e3c38;
  --mod-bg: #1b2c3b; --mod-fg: #b5d4ec; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --card: #1a2029; --fg: #e4e8ee; --muted: #9aa4b2; --line: #2e3744;
  --ai: #8fb4e0; --ai-soft: #22324a; --shu: #e8786d; --chunk: #2a1f20; --chunk-line: #6e3c38;
  --mod-bg: #1b2c3b; --mod-fg: #b5d4ec; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--zh); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.app { height: 100%; display: flex; flex-direction: column; }
header { background: var(--card); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.book { font-family: var(--jp); font-weight: 600; font-size: 15px; color: var(--ai); white-space: nowrap; }
.book small { font-family: var(--zh); font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
.pick { display: flex; gap: 6px; margin-left: auto; align-items: center; }
#selB { font-weight: 600; color: var(--ai); max-width: 46vw; }
select, button { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--ai); outline-offset: 1px; }
.gear[aria-expanded="true"] { background: var(--ai); color: var(--card); border-color: var(--ai); }
.settings { background: var(--card); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 9px; background: transparent; white-space: nowrap; }
.row { white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--card); }
main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.card { max-width: 760px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; font-size: var(--fs); }
.ref { display: flex; align-items: baseline; gap: 10px; }
.ref b { font-family: var(--jp); color: var(--shu); font-size: 1.5em; font-variant-numeric: tabular-nums; }
.ref span { color: var(--muted); font-size: .75em; letter-spacing: .05em; }
.tr { font-weight: 700; line-height: 1.7; margin: 0; }
.orig { font-family: var(--jp); font-size: 1.15em; line-height: 2.3; margin: 0; }
.mod { font-family: var(--jp); background: var(--mod-bg); color: var(--mod-fg); border-radius: 6px; padding: 6px 10px; line-height: 2.2; margin: 0; }
.lbl { font-family: var(--zh); font-size: .68em; font-weight: 500; background: var(--mod-fg); color: var(--mod-bg); border-radius: 3px; padding: 1px 6px; margin-right: 8px; letter-spacing: .05em; }
.chunks { display: flex; flex-wrap: wrap; gap: 10px 6px; padding-block: 12px; border-block: 1px dashed var(--line); }
.ck { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ck .j { font-family: var(--jp); background: var(--chunk); border: 1px solid var(--chunk-line); border-radius: 5px; padding: 2px 6px; line-height: 1.9; }
.ck svg { width: 9px; height: 12px; color: var(--muted); }
.ck .z { font-size: .72em; color: var(--muted); line-height: 1.3; max-width: 7em; text-align: center; }
.vocab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .86em; line-height: 1.6; }
.vocab li { padding-left: 1em; text-indent: -1em; }
.vocab .w { font-family: var(--jp); color: var(--shu); font-weight: 600; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: .86em; line-height: 1.7; background: var(--ai-soft); border-radius: 6px; padding: 8px 10px; }
.note .tag { background: var(--ai); color: var(--card); border-radius: 3px; padding: 0 6px; font-size: .85em; flex: none; margin-top: .2em; }
.modbox { background: var(--mod-bg); border-radius: 6px; display: flex; flex-direction: column; }
.modbox .mod { background: transparent; }
.modbox > .play { align-self: flex-start; margin-block-start: 8px; margin-inline-start: 10px; }
.mchunks { border-block: 0; border-top: 1px dashed var(--line); padding: 8px 10px 10px; margin: 0; }
.mchunks .ck .j { background: var(--card); border-color: var(--mod-fg); color: var(--mod-fg); }
.nomod .modbox { display: none; }
.tate .mchunks { border-top: 0; border-left: 1px dashed var(--line); padding: 10px 8px; }
.play { font: inherit; font-size: .8em; line-height: 1; border: 1px solid var(--line); background: var(--card); color: var(--ai); border-radius: 999px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.play[aria-pressed="true"] { background: var(--ai); color: var(--card); border-color: var(--ai); }
.play svg { width: 10px; height: 10px; }
.origrow { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.tate .play { padding: 10px 4px; }
.noruby rt { display: none; }
[hidden] { display: none !important; }
.nomod .mod, .novocab .vocab, .novocab .note { display: none; }
/* 直書 */
.tate main { writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; }
.tate .card { writing-mode: vertical-rl; max-width: none; height: 100%; box-sizing: border-box; margin: 0; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 16px; }
.tate .ref b { text-combine-upright: none; }
.tate .tcy { text-combine-upright: all; }
.tate .chunks { padding-block: 0; padding-inline: 0; border-block: 0; border-inline: 0; border-left: 1px dashed var(--line); border-right: 1px dashed var(--line); padding: 0 10px; }
.tate .ck svg { transform: rotate(90deg); }
.tate .ck .z { max-width: none; max-height: 7em; text-align: start; }
.tate .vocab li { padding-left: 0; text-indent: 0; padding-top: 1em; text-indent: -1em; }
.tate .lbl { display: block; inline-size: fit-content; margin: 0 0 0 6px; padding: 6px 2px; letter-spacing: .1em; }
.tate .note .tag { margin-top: 0; margin-right: .2em; padding: 6px 0; }
footer { background: var(--card); border-top: 1px solid var(--line); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; }
footer button { flex: 1; max-width: 160px; padding: 9px; font-weight: 500; }
.tate footer { flex-direction: row-reverse; }
.prog { flex: 1; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--shu); }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; } to { opacity: 1; } } }
</style>

</div>

.json"}, {"id": "phm", "jp": "ピレモンへの手紙", "zh": "腓利門書", "short": "ピレモン", "group": "新約・保羅書信", "file": "books/phm.json"}, {"id": "heb", "jp": "ヘブル人への手紙", "zh": "希伯來書", "short": "ヘブル", "group": "新約・普通書信", "file": "books/heb.json"}, {"id": "jas", "jp": "ヤコブの手紙", "zh": "雅各書", "short": "ヤコブ", "group": "新約・普通書信", "file": "books/jas.json"}, {"id": "1pe", "jp": "ペテロの第一の手紙", "zh": "彼得前書", "short": "Ⅰペテロ", "group": "新約・普通書信", "file": "books/1pe.json"}, {"id": "2pe", "jp": "ペテロの第二の手紙", "zh": "彼得後書", "short": "Ⅱペテロ", "group": "新約・普通書信", "file": "books/2pe.json"}, {"id": "1jn", "jp": "ヨハネの第一の手紙", "zh": "約翰一書", "short": "Ⅰヨハネ", "group": "新約・普通書信", "file": "books/1jn.json"}, {"id": "2jn", "jp": "ヨハネの第二の手紙", "zh": "約翰二書", "short": "Ⅱヨハネ", "group": "新約・普通書信", "file": "books/2jn.json"}, {"id": "3jn", "jp": "ヨハネの第三の手紙", "zh": "約翰三書", "short": "Ⅲヨハネ", "group": "新約・普通書信", "file": "books/3jn.json"}, {"id": "jud", "jp": "ユダの手紙", "zh": "猶大書", "short": "ユダ", "group": "新約・普通書信", "file": "books/jud.json"}, {"id": "rev", "jp": "ヨハネの黙示録", "zh": "啟示錄", "short": "黙示録", "group": "新約・預言書", "file": "books/rev.json"}]</script>
<script>
const BOOKS = JSON.parse(document.getElementById('books').textContent);
let DATA = null, V = [];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ruby = s => esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const ARROW = '<svg viewBox="0 0 9 12" aria-hidden="true"><path d="M4.5 1v9M1.2 7.2 4.5 10.6 7.8 7.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';
const KEY = 'kougo-reader-v1';
let S = { b: BOOKS[0].id, pos: {}, i: 0, theme: 'auto', tate: true, ruby: true, mod: true, voc: true, fs: 17, rate: 0.8 };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
if (!S.pos) S.pos = {};
if (S.pos.john === undefined && S.i) S.pos.john = S.i;
if (!BOOKS.some(b => b.id === S.b)) S.b = BOOKS[0].id;
const HOST_THEME = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') r.setAttribute('data-theme', S.theme);
  else if (HOST_THEME) r.setAttribute('data-theme', HOST_THEME);
  else r.removeAttribute('data-theme');
  for (const [id, v] of [['bThAuto', 'auto'], ['bThLight', 'light'], ['bThDark', 'dark']]) $(id).setAttribute('aria-pressed', S.theme === v);
  $('themeBtn').textContent = isDark() ? '淺色' : '深色';
}
function isDark() {
  const a = document.documentElement.getAttribute('data-theme');
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let groups = {};
BOOKS.forEach(b => (groups[b.group] = groups[b.group] || []).push(b));
$('selB').innerHTML = Object.entries(groups).map(([g, bs]) => `<optgroup label="${esc(g)}">` + bs.map(b => `<option value="${b.id}">${esc(b.zh)}</option>`).join('') + '</optgroup>').join('');

function fillVerses(c) {
  $('selV').innerHTML = V.map((v, i) => [v, i]).filter(([v]) => v.r.split(':')[0] === c)
    .map(([v, i]) => `<option value="${i}">${v.r.split(':')[1] === '0' ? '表題' : v.r.split(':')[1] + ' 節'}</option>`).join('');
}

async function loadBook(id) {
  const b = BOOKS.find(x => x.id === id);
  $('selB').value = id;
  $('card').innerHTML = '<p class="tr">載入中…</p>';
  try {
    const r = await fetch(b.file);
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch (e) {
    $('card').innerHTML = '<p class="tr">這卷書載入失敗。請確認有網路後重新打開。</p>';
    return;
  }
  V = DATA.verses; S.b = id; S.i = S.pos[id] || 0;
  const chapters = [...new Set(V.map(v => v.r.split(':')[0]))];
  $('selC').innerHTML = chapters.map(c => `<option value="${c}">第 ${c} ${DATA.unit || '章'}</option>`).join('');
  $('selC').value = ''; render();
}

function render() {
  if (!V.length) return;
  S.i = Math.max(0, Math.min(V.length - 1, S.i));
  const v = V[S.i], [c, n] = v.r.split(':');
  const tcy = x => `<span class="tcy">${x}</span>`;
  const refHtml = n === '0' ? (S.tate ? `${tcy(c)}${DATA.unit || '章'} 表題` : `${c}${DATA.unit || '章'} 表題`) : (S.tate ? `${tcy(c)}：${tcy(n)}` : `${c}:${n}`);
  $('card').innerHTML = `
    <div class="ref"><b>${refHtml}</b><span>${esc(DATA.short)}</span></div>
    <p class="tr">${esc(v.t)}</p>
    <div class="origrow"><button class="play" data-say="o" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9 Z" fill="currentColor"/></svg>朗讀</button><p class="orig">${ruby(v.c.map(x => x[0]).join(''))}</p></div>
    ${v.m ? `<div class="modbox"><button class="play" data-say="m" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9 Z" fill="currentColor"/></svg>朗讀</button><p class="mod"><span class="lbl">現代語</span>${ruby(v.m)}</p>${v.mc ? `<div class="chunks mchunks">${v.mc.map(([j, z]) => `<div class="ck"><span class="j">${ruby(j)}</span>${ARROW}<span class="z">${esc(z)}</span></div>`).join('')}</div>` : ''}</div>` : ''}
    <div class="chunks">${v.c.map(([j, z]) => `<div class="ck"><span class="j">${ruby(j)}</span>${ARROW}<span class="z">${esc(z)}</span></div>`).join('')}</div>
    <ul class="vocab">${v.v.map(([w, d]) => `<li><span class="w">${esc(w)}</span>…${esc(d)}</li>`).join('')}</ul>
    ${v.n ? `<div class="note"><span class="tag">用法</span><span>${esc(v.n)}</span></div>` : ''}`;
  const app = $('app');
  app.classList.toggle('tate', S.tate);
  app.classList.toggle('noruby', !S.ruby);
  app.classList.toggle('nomod', !S.mod);
  app.classList.toggle('novocab', !S.voc);
  document.documentElement.style.setProperty('--fs', S.fs + 'px');
  const pairs = { bR06: S.rate === 0.6, bR08: (S.rate || 0.8) === 0.8, bR10: S.rate === 1.0, bTate: S.tate, bYoko: !S.tate, bRubyOn: S.ruby, bRubyOff: !S.ruby, bModOn: S.mod, bModOff: !S.mod, bVocOn: S.voc, bVocOff: !S.voc };
  for (const k in pairs) $(k).setAttribute('aria-pressed', pairs[k]);
  if ($('selC').value !== c || !$('selV').querySelector(`option[value="${S.i}"]`)) { $('selC').value = c; fillVerses(c); }
  $('selV').value = S.i;
  $('pos').textContent = `${v.r}　${S.i + 1} / ${V.length}`;
  $('barI').style.width = ((S.i + 1) / V.length * 100) + '%';
  $('prev').disabled = S.i === 0; $('next').disabled = S.i === V.length - 1;
  const m = $('main'); m.scrollTop = 0; m.scrollLeft = 0;
  S.pos[S.b] = S.i;
  save();
}

const plain = s => s.replace(/\{([^|}]+)\|[^}]+\}/g, '$1').replace(/[「」『』（）()〔〕\[\]]/g, '');
let jaVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    jaVoice = vs.find(v => /Kyoko|Otoya|Google|Nanami|Haruka|O-Ren/i.test(v.name)) || vs[0] || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(kind, btn) {
  if (!('speechSynthesis' in window)) { btn.textContent = '此瀏覽器不支援朗讀'; return; }
  const was = btn.getAttribute('aria-pressed') === 'true';
  speechSynthesis.cancel();
  document.querySelectorAll('.play').forEach(b => b.setAttribute('aria-pressed', 'false'));
  if (was) return;
  const v = V[S.i]; const text = plain(kind === 'm' ? v.m : v.c.map(x => x[0]).join(''));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = S.rate || 0.8;
  u.onend = u.onerror = () => btn.setAttribute('aria-pressed', 'false');
  btn.setAttribute('aria-pressed', 'true');
  speechSynthesis.speak(u);
}
document.addEventListener('click', e => { const b = e.target.closest('.play'); if (b) say(b.dataset.say, b); });
const go = d => { if (!V.length) return; try { speechSynthesis.cancel(); } catch (e) {} S.i += d; render(); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('selC').onchange = e => { S.i = V.findIndex(v => v.r.split(':')[0] === e.target.value); render(); };
$('selV').onchange = e => { S.i = +e.target.value; render(); };
$('selB').onchange = e => loadBook(e.target.value);
$('gear').onclick = () => { const s = $('settings'); s.hidden = !s.hidden; $('gear').setAttribute('aria-expanded', !s.hidden); };
const set = (k, val) => () => { S[k] = val; V.length ? render() : save(); };
$('bTate').onclick = set('tate', true); $('bYoko').onclick = set('tate', false);
$('bRubyOn').onclick = set('ruby', true); $('bRubyOff').onclick = set('ruby', false);
$('bModOn').onclick = set('mod', true); $('bModOff').onclick = set('mod', false);
$('bVocOn').onclick = set('voc', true); $('bVocOff').onclick = set('voc', false);
for (const [id, v] of [['bThAuto', 'auto'], ['bThLight', 'light'], ['bThDark', 'dark']]) $(id).onclick = () => { S.theme = v; applyTheme(); save(); };
$('themeBtn').onclick = () => { S.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); };
for (const [id, r] of [['bR06', 0.6], ['bR08', 0.8], ['bR10', 1.0]]) $(id).onclick = () => { S.rate = r; render(); };
$('bFsDn').onclick = () => { S.fs = Math.max(13, S.fs - 1); render(); };
$('bFsUp').onclick = () => { S.fs = Math.min(26, S.fs + 1); render(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') go(S.tate ? -1 : 1);
  if (e.key === 'ArrowLeft') go(S.tate ? 1 : -1);
});
let tx = null, ty = null;
$('main').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('main').addEventListener('touchend', e => {
  if (tx === null || S.tate) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  tx = null;
}, { passive: true });
applyTheme();
loadBook(S.b);
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
